on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      comment-id:
        required: true
        type: string
      GITHUB_REPOSITORY:
        required: true
        type: string
      TELEGRAM_CHAT_ID:
        required: true
        type: string
      home_path:
        required: true
        type: string
    secrets:
      TELEGRAM_TOKEN:
        required: true

jobs:
  shameWorkflow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: hmarr/debug-action@v2

    - uses: actions/checkout@v1
      with:
        ref: ${{ inputs.ref }}

    - name: Cache compiler installations
      uses: actions/cache@v2
      with:
        path: |
          ${{inputs.home_path}}/.solcx
          ${{inputs.home_path}}/.vvm
        key: ${{ runner.os }}-woofy-compiler-cache-v1

    - name: Setup node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        check-latest: true

    - name: Install ganache
      run: npm install -g ganache-cli@6.12.1

    - name: Set up python 3.8
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Restore pip cache
      uses: actions/cache@v2
      id: pip-cache
      with:
        path: |
          ${{inputs.home_path}}/.cache/pip/
        key: ${{ runner.os }}-pip-v2-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-v2-${{ hashFiles('**/requirements-dev.txt') }}
          ${{ runner.os }}-pip-v2-

    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel
        pip install -r requirements-dev.txt

    - name: Security overrides (certifi / aiohttp / urllib3)
      shell: bash
      run: |
        # eth-brownie pins certifi/aiohttp/urllib3 exactly, so pip keeps old, vulnerable copies.
        pins=$(mktemp)
        # Upgrade them to the newest versions every *other* installed package still accepts.
        python - > "$pins" <<'PY'
        import importlib.metadata as m, re
        targets = {"certifi", "aiohttp", "urllib3"}
        norm = lambda s: re.sub(r"[-_.]+", "-", s).lower()
        have = {norm(d.metadata["Name"] or "") for d in m.distributions()}
        for t in ("certifi>=2026.10.19", "aiohttp", "urllib3"):
            if t.startswith("certifi") or t in have:
                print(t)
        for d in m.distributions():
            n = norm(d.metadata["Name"] or "")
            if n in targets or n == "eth-brownie":
                continue
            for r in d.requires or []:
                if "extra ==" in r:
                    continue
                if norm(re.split(r"[\s;<>=!~\[(]", r, maxsplit=1)[0]) in targets:
                    print(f"{n}=={d.version}")
                    break
        PY
        pip install -q -U -r "$pins" || { echo "::warning::constrained upgrade failed, upgrading certifi only"; pip install -q -U "certifi>=2026.10.19"; }
        pip list 2>/dev/null | grep -Ei '^(certifi|aiohttp|urllib3) '

    - name: delete .brownie/accounts after cache download
      run: |
        rm -rf ~/.brownie/accounts
    
    - name: Add network config
      timeout-minutes: 1
      run: |
        brownie networks list true
        cp network-config.yaml ~/.brownie/
        brownie networks list true

    - name: Brownie compile
      timeout-minutes: 3
      run: |
        brownie compile

    - name: Run Function
      id: fn
      timeout-minutes: 3
      run: |
        brownie run shame ci_alert --network eth-main-fork

    - name: Read alert
      id: alert
      uses: juliangruber/read-file-action@v1
      with:
        path: ${{inputs.home_path}}/alert.txt
        trim: false

    - name: New TX Telegram Alert
      uses: appleboy/telegram-action@v0.1.1
      with:
        to: ${{ inputs.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: markdown
        message: |
          ${{ steps.alert.outputs.content }}

    - name: Add reaction
      uses:  peter-evans/create-or-update-comment@v2.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ inputs.GITHUB_REPOSITORY }}
        comment-id: ${{ inputs.comment-id }}
        reaction-type: hooray
